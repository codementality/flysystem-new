# Factory-layer services only. This module contributes ZERO services
# tagged 'stream_wrapper' — enforced by tests/src/Unit contract tests.
#
# Adapters are container services carrying a 'flysystem.adapter' tag with
# a driver name; a compiler pass collects the tags at build time. Adding
# a backend is a tagged service — four lines — contributed here or by any
# module, through the identical rail.
services:
  # The adapter manager: presents the tagged-service definitions and
  # hands out the container-built adapter for a driver.
  flysystem.adapter_manager:
    class: Drupal\flysystem\Adapter\FlysystemAdapterManager
    arguments: [ [], '@service_container', '@module_handler' ]

  # The module's built-in local backend, registered like any adapter.
  flysystem.adapter.local:
    class: Drupal\flysystem\Adapter\Local
    arguments: ['%app.root%']
    tags:
      - { name: flysystem.adapter, driver: local, label: 'Local files' }

  # Answers plugin-locality questions from definition data alone.
  flysystem.feature_inspector:
    class: Drupal\flysystem\Verification\AdapterFeatureInspector
    arguments: ['@flysystem.adapter_manager']

  # The settings.php definition source.
  flysystem.settings_source:
    class: Drupal\flysystem\Definition\SettingsSource

  # Validates the configuration of the scheme currently being touched.
  flysystem.binding_validator:
    class: Drupal\flysystem\Validation\SettingsValidator
    arguments: ['%app.root%', '@flysystem.feature_inspector']

  # Resolves scheme bindings to merged definitions.
  flysystem.binding_resolver:
    class: Drupal\flysystem\Resolution\BindingResolver
    arguments: [ [ '@flysystem.settings_source' ], '@flysystem.binding_validator' ]

  # Builds and memoizes operators per scheme.
  flysystem.operator_factory:
    class: Drupal\flysystem\Factory\OperatorFactory
    arguments: ['@flysystem.binding_resolver', '@flysystem.adapter_manager', '@flysystem.feature_inspector', '@logger.channel.flysystem']

  # The verification surface consumed by tests now and tooling later.
  flysystem.binding_verifier:
    class: Drupal\flysystem\Verification\BindingVerifier
    arguments: ['@flysystem.binding_resolver', '@flysystem.operator_factory', [ '@flysystem.settings_source' ], '@logger.channel.flysystem']

  # Flysystem's own logger channel: every logged line is identifiable as
  # coming from this module and flows to the database log, syslog and any
  # downstream log handler through the standard logging pipeline.
  logger.channel.flysystem:
    parent: logger.channel_base
    arguments: ['flysystem']

  # Supplies the Flysystem section of the status report page.
  flysystem.status_reporter:
    class: Drupal\flysystem\Verification\StatusReporter
    arguments: ['@flysystem.binding_verifier']

  # Class-name alias so constructor injection resolves to the service above.
  Drupal\flysystem\Verification\StatusReporter:
    alias: flysystem.status_reporter
